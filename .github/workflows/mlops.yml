name: AutoPharma MLOps Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirement.txt ]; then pip install -r backend/requirement.txt; fi
          pip install httpx pytest # Ensure test dependencies

      - name: Run Tests
        run: |
          cd backend
          # We set PYTHONPATH to include current dir so imports work
          export PYTHONPATH=$PYTHONPATH:.
          pytest tests/
